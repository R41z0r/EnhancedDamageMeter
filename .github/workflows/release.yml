name: CI

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve immutable source pin
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          config = json.load(open('source.json'))
          assert os.environ['REF_TYPE'] == 'tag', 'Publication requires an immutable release tag'
          assert config['version'] == os.environ['RELEASE_TAG'], 'Tag must match source.json version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"ref={config['ref']}\nversion={config['version']}\n")
          PYTHON

      - name: Checkout EnhanceQoL source
        uses: actions/checkout@v6
        with:
          repository: R41z0r/EnhanceQoL
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ secrets.ENHANCEQOL_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0

      - name: Test update selection
        run: python3 tests/auto_release.py
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check
      - name: Prepare source packager gates
        shell: bash
        run: bash source/scripts/prepare_packager_gates.sh "${{ steps.source.outputs.version }}"

      - name: Extract standalone changelog
        shell: bash
        run: python3 scripts/extract_changelog.py source/CHANGELOG.md "${{ steps.source.outputs.version }}" CHANGELOG.md

      - name: Build standalone addon
        shell: bash
        run: bash scripts/build.sh build/EnhancedDamageMeter source

      - name: Validate standalone package
        run: |
          lua5.1 scripts/test_standalone.lua build/EnhancedDamageMeter 120105
          lua5.1 scripts/test_standalone.lua build/EnhancedDamageMeter 120107
          lua5.1 scripts/test_standalone.lua build/EnhancedDamageMeter 16001
          find build/EnhancedDamageMeter -name '*.lua' -exec luac5.1 -p {} \;
          python3 source/scripts/check_lua_upvalues.py build/EnhancedDamageMeter

      - name: Validate generated Lua
        uses: nebularg/actions-luacheck@v1
        with:
          args: "--no-color -q build/EnhancedDamageMeter"
          annotate: warning

      - name: Stage generated package
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/rsync -a --exclude '.DS_Store' build/EnhancedDamageMeter/ ./
          git add -f -- CHANGELOG.md EnhancedDamageMeter.toc Core.lua Functions.lua Settings.lua DamageMeter.lua Icons Core General Locales libs

      - name: Create Package and release
        uses: BigWigsMods/packager@v2
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CURSE_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
